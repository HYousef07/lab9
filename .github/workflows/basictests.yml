name: Lab 9 Tests

on:
  push:
    branches: [main, test]

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run basic tests
        run: |
          bash validate-data.sh "John" "0871234567" | grep -x PASS
          bash validate-data.sh "ChristopherAlexanderX" "0871234567" | grep -x FAIL
          bash validate-data.sh "John" "08712345678" | grep -x FAIL
